name: Android bootstrap verification

on:
  push:
    branches: [dev/android-v110-release]

permissions:
  contents: read

concurrency:
  group: android-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          check-latest: false
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
          overwrite-settings: false
      - name: Assert toolchain and inspect existing official SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.9.0
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.9.0
          java -version 2>&1 | grep -E 'version "21[.]'
          node scripts/verify-android-build.mjs sdk
      - name: Install separate locked packages
        run: |
          npm ci
          npm --prefix android-shell ci
      - name: Static and production safety checks
        run: |
          npm run lint
          npm run typecheck
          npm run preflight
      - name: Complete npm regression with exact baseline accounting
        run: node scripts/android-test-report.mjs run
      - name: Build sync and verify isolated offline assets
        run: |
          npm run sync:android
          npm run verify:android
      - name: Compile and test native debug shell privately
        id: compile
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --version | tee ../build/android-ci/gradle-version.txt
          grep -F 'Gradle 8.14.3' ../build/android-ci/gradle-version.txt
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Official headless emulator instrumentation
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set +e
          bash scripts/android-emulator-test.sh
          status=$?
          set -e
          if [ "$status" -eq 78 ]; then
            echo 'Emulator environment blocked; see emulator-report.json. Native acceptance remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Verify private APK and write truthful bootstrap receipt
        if: always() && steps.compile.outcome == 'success'
        run: node scripts/verify-android-build.mjs receipt
      - name: Upload allowlisted verification reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bootstrap-verification-${{ github.sha }}
          path: |
            build/android-ci/android-build-receipt.json
            build/android-ci/node-test-report.json
            build/android-ci/node-events.jsonl
            build/android-ci/sdk-report.json
            build/android-ci/emulator-report.json
            build/android-ci/SHA256SUMS
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.xml
            android/app/build/outputs/androidTest-results/connected/debug/*.xml
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          archive: true
