name: Android isolated emulator infrastructure probe
on:
  push:
    branches: [dev/android-v110-emulator-probe]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/android-emulator-probe.sh
            /scripts/android-emulator-probe-space.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: One bounded official TCG infrastructure boot
        shell: bash
        run: |
          set +e
          bash scripts/android-emulator-probe.sh
          status=$?
          if [ "$status" -eq 78 ]; then
            echo 'Infrastructure BLOCKED; product checks have not run. See emulator-probe-report.json and official logs.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Preserve fixed infrastructure evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-infrastructure-probe-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/android-ci/emulator-probe/emulator-probe-report.json
            build/android-ci/emulator-probe/space-before-install.json
            build/android-ci/emulator-probe/space-after-install.json
            build/android-ci/emulator-probe/java-version.log
            build/android-ci/emulator-probe/official-package-versions.log
            build/android-ci/emulator-probe/emulator-probe-install.log
            build/android-ci/emulator-probe/emulator-probe-avd.log
            build/android-ci/emulator-probe/emulator-probe-boot.log
            build/android-ci/emulator-probe/emulator-probe-endpoint.log
            build/android-ci/emulator-probe/emulator-probe-identity.log
            build/android-ci/emulator-probe/emulator-probe-api.txt
            build/android-ci/emulator-probe/emulator-probe-build.txt
            build/android-ci/emulator-probe/emulator-probe-webview.txt
