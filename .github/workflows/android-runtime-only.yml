name: Android v1.0.13 exact delivered APK runtime
on:
  push:
    branches: [dev/android-v113-runtime]
permissions:
  contents: read
  actions: read
concurrency:
  group: android-v113-exact-runtime
  cancel-in-progress: false
jobs:
  runtime:
    if: github.repository == 'Night-SHANG/chache' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/android-release-runtime.sh
            /scripts/android-release-runtime-verify.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
          overwrite-settings: false
          cache-jdk: false
      - name: Download immutable already delivered signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 11760973241
          run-id: 38279507392
          github-token: ${{ github.token }}
          path: build/android-runtime-only/input
          digest-mismatch: error
      - name: Verify exact delivered APK before installation
        run: python scripts/android-release-runtime-verify.py
      - name: Bounded full AOSP same-API runtime with unchanged disk guard
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s bash scripts/android-release-runtime.sh
          status=$?
          set -e
          if [ "$status" -eq 78 ]; then
            echo 'Measured emulator block. Read runtime-result.json; this is not runtime acceptance.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Preserve only exact-run runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-v113-exact-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            build/android-runtime-only/apk-verification.json
            build/android-runtime-only/runtime-result.json
            build/android-runtime-only/space-*.json
            build/android-runtime-only/*.txt
            build/android-runtime-only/image-source.properties
            build/android-runtime-only/product-cold-launch.png
            build/android-runtime-only/product-resume.png
            build/android-runtime-only/product-restart.png
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          archive: true
